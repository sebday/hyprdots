name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          shopt -s nullglob
          fail=0
          for script in evoshell/bin/* scripts/* .install/installer.sh .install/bin/* evoshell/modules/*/bin/* evoshell/modules/*/*/bin/*; do
            [[ -f "$script" && ! -L "$script" ]] || continue
            head -1 "$script" | grep -q bash || continue
            bash -n "$script" || fail=1
          done
          exit "$fail"
