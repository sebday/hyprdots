# Read by Electron 43 (Cursor) on every launch.
# The Arch cursor wrapper loads electronNN-flags.conf for its electron soname.
# Native Wayland + fractional scale on Hyprland (e.g. DP-1 @ 1.5).
--ozone-platform=wayland
--enable-features=UseOzonePlatform,WaylandFractionalScaleV1,WaylandWindowDecorations
--disable-features=WaylandWpColorManagerV1
