# M-Audio Audiophile 24/96 (ICE1712). PipeWire's default 5s idle suspend
# closes the PCM and the DAC clicks on reopen; mmap_commit Broken pipe is
# an xrun on this card. Keep it open and give ALSA more headroom.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_0c_02.0.*" }
      { node.name = "~alsa_input.pci-0000_0c_02.0.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        api.alsa.headroom = 2048
        api.alsa.period-size = 1024
        api.alsa.disable-tsched = true
      }
    }
  }
]
