name = "power"
name_pretty = "Power"
icon = "system-reboot-symbolic"
search_name = true

[[entries]]
text = "Lock"
icon = "system-lock-screen-symbolic"
keywords = ["lock", "hyprlock", "screen"]
actions = { "menus:default" = "bash -lc 'exec hyprlock'" }

[[entries]]
text = "Relaunch"
icon = "system-log-out-symbolic"
keywords = ["relaunch", "logout", "session", "hyprland", "exit"]
actions = { "menus:default" = "bash -lc 'exec \"$HOME/.local/bin/hypr-logout.sh\" relaunch'" }

[[entries]]
text = "Restart"
icon = "system-reboot-symbolic"
keywords = ["reboot", "restart"]
actions = { "menus:default" = "bash -lc 'exec \"$HOME/.local/bin/hypr-logout.sh\" reboot'" }

[[entries]]
text = "Shutdown"
icon = "system-shutdown-symbolic"
keywords = ["shutdown", "power off", "off"]
actions = { "menus:default" = "bash -lc 'exec \"$HOME/.local/bin/hypr-logout.sh\" shutdown'" }
