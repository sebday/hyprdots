# Curated emoji list for Walker (`walker -m menus`). Requires elephant-menus (menus.so).
# Copy uses wl-copy with stdin (menu action "wl-copy" + entry value).
# Edit entries freely; `fixed_order` keeps this row order instead of sorting A–Z.

