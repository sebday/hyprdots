name = "system"
name_pretty = "System"
icon = "preferences-desktop"
search_name = true

[[entries]]
text = "Themes"
icon = "preferences-color"
keywords = ["theme", "appearance", "rice"]
submenu = "theme"

[[entries]]
text = "Wallpaper"
icon = "preferences-desktop-wallpaper"
keywords = ["wallpaper", "background"]
submenu = "wallpaper"

[[entries]]
text = "Show keybinds"
icon = "input-keyboard"
actions = { "menus:default" = "bash -lc 'exec \"$HOME/.local/bin/walker-keybinds.sh\"'" }

[[entries]]
text = "Waybar restart"
icon = "view-refresh"
actions = { "menus:default" = "bash -lc 'pkill waybar 2>/dev/null || true; setsid -f waybar </dev/null >/dev/null 2>&1'" }

[[entries]]
text = "Waybar position"
icon = "preferences-desktop-display"
actions = { "menus:default" = "bash -lc 'exec \"$HOME/.local/bin/waybar-position.sh\"'" }

[[entries]]
text = "Clear cache"
icon = "edit-clear"
actions = { "menus:default" = "bash -lc 'exec \"$HOME/.local/bin/hypr-cleanup.sh\"'" }
