# Use --class="TUI.float" to set a window to float (Thank you to dhh for the inspiration)
# Use ALT for the alternative to a program
# Use CTRL to control movement or resize
# Use SHIFT to move windows

$BROWSER = brave
$TERMINAL = ghostty
$EDITOR = nvim

bindd = SUPER, Space, System Menu, exec, ~/.local/bin/menu-main.sh
bindd = SUPER, Return, Terminal, exec, $TERMINAL
bindd = SUPER ALT, Return, Terminal, exec, $TERMINAL -e agent
bindd = SUPER, Escape, Power Menu, exec, ~/.local/bin/menu-power.sh
bindd = SUPER, W, Close Active Window, killactive,
bindd = SUPER, E, Editor, exec, $TERMINAL -e nano ~/
bindd = SUPER, T, GUI File Manager, exec, thunar
bindd = SUPER, I, Colour Picker, exec, hyprpicker -al
bindd = SUPER, D, Menu, exec, ~/.local/bin/launch-walker
bindd = SUPER, F, Fullscreen, fullscreen, 1
bindd = SUPER, H, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bindd = SUPER, G, Toggle gaps on workspace, exec, ~/.local/bin/toggle-gaps.sh
bindd = SUPER, J, Toggle Split Direction, togglesplit,
bindd = SUPER, K, Toggle Floating Window, togglefloating,
bindd = SUPER, L, Lock Screen, exec, hyprlock
bindd = SUPER, V, Clipboard History, exec, ~/.local/bin/launch-walker -m clipboard
bindd = SUPER ALT, V, Common emojis, exec, ~/.local/bin/launch-walker -m menus

# Programs
bindd = SUPER, 1, Brave Browser, exec, $BROWSER
bindd = SUPER, 2, Brave Incognito, exec, $BROWSER --incognito
bindd = SUPER, 3, Calculator, exec, qalculate-gtk
bindd = SUPER, 4, Dev, exec, ~/.local/bin/open-dev-workspace.sh

# Switch workspaces with numpad keys
bindd = SUPER, KP_End, Workspace 1, workspace, 1
bindd = SUPER, KP_Down, Workspace 2, workspace, 2
bindd = SUPER, KP_Next, Workspace 3, workspace, 3
bindd = SUPER, KP_Left, Workspace 4, workspace, 4
bindd = SUPER, KP_Begin, Workspace 5, workspace, 5
bindd = SUPER, KP_Right, Workspace 6, workspace, 6
bindd = SUPER, KP_Home, Workspace 7, workspace, 7
bindd = SUPER, KP_Up, Workspace 8, workspace, 8
bindd = SUPER, KP_Prior, Workspace 9, workspace, 9
bindd = SUPER, KP_Insert, Workspace 10, workspace, 10

# Move focus with arrow keys
bindd = SUPER, left, Move Focus Left, movefocus, l
bindd = SUPER, right, Move Focus Right, movefocus, r
bindd = SUPER, up, Move Focus Up, movefocus, u
bindd = SUPER, down, Move Focus Down, movefocus, d

# Cycle workspaces with SUPER + Tab
bindd = SUPER, Tab, Cycle to Next Workspace, workspace, e+1
bindd = SUPER, mouse_down, Cycle to Next Workspace, workspace, e+1
bindd = SUPER, mouse_up, Cycle to Previous Workspace, workspace, e-1
# Cycle rather than walk through workspaces
binds {
    workspace_back_and_forth = false
    allow_workspace_cycles = false
}

# Move active window to a workspace with numpad
bindd = SUPER SHIFT, KP_End, Move Active Window to Workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT, KP_Down, Move Active Window to Workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT, KP_Next, Move Active Window to Workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT, KP_Left, Move Active Window to Workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT, KP_Begin, Move Active Window to Workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT, KP_Right, Move Active Window to Workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT, KP_Home, Move Active Window to Workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT, KP_Up, Move Active Window to Workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT, KP_Prior, Move Active Window to Workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT, KP_Insert, Move Active Window to Workspace 10, movetoworkspacesilent, 10

# Scratchpad
bindd = SUPER, S, Toggle Scratchpad, togglespecialworkspace, magic
bindd = SUPER SHIFT, S, Move Window to Scratchpad, movetoworkspacesilent, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow                                            # Move window with mouse
bindm = SUPER, mouse:273, resizewindow                                          # Resize window with mouse
bindd = SUPER SHIFT, left, Move Window Left, movewindow, l
bindd = SUPER SHIFT, right, Move Window Right, movewindow, r
bindd = SUPER SHIFT, up, Move Window Up, movewindow, u
bindd = SUPER SHIFT, down, Move Window Down, movewindow, d

# Repeatable binds for resizing the active window
binde = SUPER CTRL, right, resizeactive, 20 0                                   # Resize window wider
binde = SUPER CTRL, left, resizeactive, -20 0                                   # Resize window narrower
binde = SUPER CTRL, up, resizeactive, 0 -20                                     # Resize window shorter
binde = SUPER CTRL, down, resizeactive, 0 20                                    # Resize window taller

# Volume controls
bindle = , XF86AudioRaiseVolume, exec, ~/.local/bin/volume.sh up                # Volume up
bindle = , XF86AudioLowerVolume, exec, ~/.local/bin/volume.sh down              # Volume down
bindle = , XF86AudioMute, exec, ~/.local/bin/volume.sh mute                     # Mute volume
bindl = , XF86AudioPlay, exec, playerctl play-pause                             # Play/Pause media
bindl = , XF86AudioNext, exec, playerctl next                                   # Next media track
bindl = , XF86AudioPrev, exec, playerctl previous                               # Previous media track

# Wallpaper
bindd = SUPER, equal, Next Wallpaper, exec, bash ~/.local/bin/wallpaper.sh next
bindd = SUPER, minus, Previous Wallpaper, exec, bash ~/.local/bin/wallpaper.sh prev

# Screenshot & record
bindd = , PRINT, Screenshot Region, exec, bash -c "hyprshot -m region -o /tmp/ -f hyprshot.png;"
bindd = ALT, PRINT, Screenshot Active Monitor, exec, bash -c "hyprshot -m output -m active -o /tmp/ -f hyprshot.png;"
bindd = SUPER, PRINT, Open Swappy, exec, swappy -f /tmp/hyprshot.png
bindd = SUPER, R, Record Region, exec, ~/.local/bin/record.sh
bindd = SUPER ALT, R, Record Fullscreen, exec, ~/.local/bin/record.sh --fullscreen
