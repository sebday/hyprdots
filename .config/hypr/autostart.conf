# Autostart

exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = insync start
exec-once = wl-paste --watch cliphist store
exec-once = [workspace 8 silent] obsidian
exec-once = [workspace 10 silent] ghostty -e btop
exec-once = [workspace 10 silent] firefox
exec-once = [workspace 2] brave --disable-features=WaylandWpColorManagerV1
exec-once = bash -c 'sleep 10 && waybar'