# Floating windows
windowrule = float, tag:floating-window
windowrule = center, tag:floating-window
windowrule = size 1024 768, tag:floating-window
windowrule = tag +floating-window, class:(qalculate-gtk|.*-Default|TUI.float)
windowrule = tag +floating-window, title:^(Open.*Files?|Save.*Files?|Save.*As|All Files|Save|.*wants to save.*|.*wants to open.*)
windowrule = tag +floating-window, class:^(brave-browser)$, title:^(.*Sign in.*)
windowrule = tile, class:^(TUI.tiled)$

# Transparency
windowrule = opacity 1 1 override, class:^(mpv|imv|imv-dir)$
windowrule = opacity 1 1 override, title:^(.*Picture-in-Picture.*|.*Google Home.*|.*YouTube.*)

# General
windowrule = suppressevent maximize, class:.*
windowrule = workspace 10, class:^(firefox)$
