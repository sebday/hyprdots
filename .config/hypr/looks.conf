# Cursors
env = XCURSOR_THEME, "Vimix-cursors"
env = XCURSOR_SIZE, 24

# Fractional scaling
xwayland {
    force_zero_scaling = true
}

# Look n feel
general { 
    gaps_in = 10
    gaps_out = 20
    border_size = 2

    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(cdd6f4aa)

    resize_on_border = false 
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 0.97
    inactive_opacity = 0.88

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        passes = 2
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsIn, 1, 7, myBezier, slide top
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, myBezier, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc { 
    force_default_wallpaper = 0 
    disable_hyprland_logo = true
    background_color = 0x0a0e19
}