set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g default-shell /bin/bash
set -g default-command "bash -i"
unbind C-b
bind C-Space send-prefix
bind s run-shell ~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh
bind v split-window -v
bind h split-window -h
bind k kill-pane
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n C-S-Left resize-pane -L
bind -n C-S-Right resize-pane -R
bind -n C-S-Up resize-pane -U
bind -n C-S-Down resize-pane -D
run '~/.tmux/plugins/tpm/tpm'
